<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AgroMarket</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">
                AgroMarket
            </div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="#">Products</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
        </nav>
    </header>


    <!-- Login Section -->
    <main class="auth-container">

        <div class="auth-box">

            <h1>Welcome Back</h1>

            <p>Login to your AgroMarket account</p>

            <form>

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p class="auth-link">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 AgroMarket. All Rights Reserved.</p>
    </footer>

    <script src="js/auth.js"></script>

</body>
</html>
